name: lumina_plugin_miniai
description: "An AI assistant inside Lumina Studio: chat with a local or cloud model that works on your project through the editor MCP tools."
version: 0.1.0
publish_to: none
repository: https://github.com/LuminaGame/plugins

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lumina_editor_api:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_editor_api
  shadcn_flutter: 0.0.55
  # The provider's HTTP + SSE client (the host resolves ^1.6.0).
  http: ^1.6.0
  # The local model install (SHA-256 checks, llama.cpp archives).
  crypto: ^3.0.7
  archive: ^4.3.0
  # The assistant's answers render as Markdown (GitHub flavoured).
  markdown: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The manifest test parses lumina_plugin_miniai.lmplugin with lumina's own
  # PluginRepository (the plugin itself depends on the API only).
  lumina:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina
  flutter_lints: ^6.0.0
  test: ^1.24.0

flutter:
